services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vidaplus
      POSTGRES_USER: vidaplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidaplus -d vidaplus"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
